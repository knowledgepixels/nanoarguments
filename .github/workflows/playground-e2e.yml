name: Playground e2e

on:
  push:
    branches: [main]
    paths: ['playground/**', 'js/**', 'shapes/**', '.github/workflows/playground-e2e.yml']
  pull_request:
    paths: ['playground/**', 'js/**', 'shapes/**', '.github/workflows/playground-e2e.yml']
  # Catches changes elsewhere in the ecosystem: registries, query services, published templates.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: playground-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playground/playwright-report/
            playground/test-results/
          retention-days: 14
